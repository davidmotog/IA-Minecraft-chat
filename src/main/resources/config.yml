  pico de madera: wooden_pickaxe
  espada de diamante: diamond_sword
  mesa de crafteo: crafting_table
  mesa de trabajo: crafting_table
  horno: furnace
  alto horno: blast_furnace
  ahumador: smoker
  cofre: chest
  cofre de ender: ender_chest
  antorcha: torch
  antorchas: torch
  palo: stick
  palos: stick
