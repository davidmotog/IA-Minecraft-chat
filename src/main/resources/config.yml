# El archivo .env tiene prioridad sobre la variable de entorno y api-key.
openai:
  env-file: '.env'
  api-key: ''
  model: 'gpt-5.4-mini'
  timeout-seconds: 40
  max-output-tokens: 1200
limits:
  cooldown-seconds: 8
  concurrent-requests: 4
  requests-per-minute: 20
  max-question-characters: 1000
  max-answer-characters: 1800
chat:
  # Escribe @ia seguido de tu pregunta; solo tú recibirás la respuesta.
  enabled: true
  prefix: '@ia'
images:
  enabled: true
memory:
  # Últimos 4 intercambios de cada jugador, hasta 30 minutos sin actividad.
  enabled: true
# Puedes añadir nombres en español. Los identificadores son los del juego.
aliases:
  piston: piston
  piston pegajoso: sticky_piston
  pico de diamante: diamond_pickaxe
